services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER:?Set SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER
        in private environment}
      POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD:?Set SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD
        in private environment}
      POSTGRES_DB: document_intelligence_db
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - document_intelligence-network
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    networks:
    - document_intelligence-network
  api_gateway:
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile
    ports:
    - 8001:8001
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in private environment}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL:?Set CASEBOOK_API_SERVICE_URL
        in private environment}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL:?Set DATA_PROCESSING_SERVICE_URL
        in private environment}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL:?Set DATABASE_SERVICE_URL in private
        environment}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL:?Set FILE_EXPORT_SERVICE_URL
        in private environment}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL:?Set CACHE_SERVICE_URL in private environment}
      SETTINGS_PASSPHRASE: ${SETTINGS_PASSPHRASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    depends_on:
    - postgres
    - redis
    networks:
    - document_intelligence-network
    volumes:
    - ./backend:/app/backend
    - ./settings.json:/settings.json:ro
    - ./settings.json.enc:/settings.json.enc:ro
  pravo_api_service:
    build:
      context: ./backend/pravo_tech_casebook_api_service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in private environment}
      SETTINGS_PASSPHRASE: ${SETTINGS_PASSPHRASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    volumes:
    - ./settings.json:/settings.json:ro
    - ./settings.json.enc:/settings.json.enc:ro
    depends_on:
    - redis
    networks:
    - document_intelligence-network
  data_processing:
    build:
      context: ./backend/data_processing_services
      dockerfile: Dockerfile
    ports:
    - 8002:8002
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in private environment}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL:?Set DATABASE_SERVICE_URL in private
        environment}
      SETTINGS_PASSPHRASE: ${SETTINGS_PASSPHRASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    volumes:
    - ./settings.json:/settings.json:ro
    - ./settings.json.enc:/settings.json.enc:ro
    - ./backend:/app/backend
    depends_on:
    - redis
    networks:
    - document_intelligence-network
  celery_worker:
    build:
      context: ./backend/data_processing_services
      dockerfile: Dockerfile
    command: celery -A orchestrator worker --loglevel=info -Q processing,celery
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in private environment}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL:?Set DATABASE_SERVICE_URL in private
        environment}
      SETTINGS_PASSPHRASE: ${SETTINGS_PASSPHRASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    volumes:
    - ./settings.json:/settings.json:ro
    - ./settings.json.enc:/settings.json.enc:ro
    - ./backend:/app/backend
    depends_on:
    - redis
    networks:
    - document_intelligence-network
  database_service:
    build:
      context: ./backend/database_service
      dockerfile: Dockerfile
    ports:
    - 8003:8003
    environment:
      SETTINGS_PASSPHRASE: ${SETTINGS_PASSPHRASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      REDIS_URL: ${REDIS_URL-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    depends_on:
    - postgres
    networks:
    - document_intelligence-network
    volumes:
    - ./settings.json:/settings.json:ro
    - ./settings.json.enc:/settings.json.enc:ro
  file_export_service:
    build:
      context: ./backend/file_export_service
      dockerfile: Dockerfile
    ports:
    - 8004:8004
    networks:
    - document_intelligence-network
    volumes:
    - ./exports:/app/exports
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      REDIS_URL: ${REDIS_URL-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
  cache_service:
    build:
      context: ./backend/cache_service
      dockerfile: Dockerfile
    ports:
    - 8005:8005
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in private environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
    depends_on:
    - redis
    networks:
    - document_intelligence-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
    - 80:80
    depends_on:
    - api_gateway
    networks:
    - document_intelligence-network
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      CASEBOOK_USERNAME: ${CASEBOOK_USERNAME-}
      CASEBOOK_PASSWORD: ${CASEBOOK_PASSWORD-}
      CASEBOOK_BASE_URL: ${CASEBOOK_BASE_URL-}
      NETWORK_PROXY_HTTP: ${NETWORK_PROXY_HTTP-}
      NETWORK_PROXY_SOCKS5: ${NETWORK_PROXY_SOCKS5-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET-}
      AUTH_USERS_USERNAME: ${AUTH_USERS_USERNAME-}
      AUTH_USERS_PASSWORD_BCRYPT: ${AUTH_USERS_PASSWORD_BCRYPT-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_PASSWORD-}
      REDIS_URL: ${REDIS_URL-}
      CASEBOOK_API_SERVICE_URL: ${CASEBOOK_API_SERVICE_URL-}
      DATA_PROCESSING_SERVICE_URL: ${DATA_PROCESSING_SERVICE_URL-}
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL-}
      FILE_EXPORT_SERVICE_URL: ${FILE_EXPORT_SERVICE_URL-}
      CACHE_SERVICE_URL: ${CACHE_SERVICE_URL-}
      REDIS_URL_ALT_2: ${REDIS_URL_ALT_2-}
      DB_URL_FALLBACK: ${DB_URL_FALLBACK-}
      DATABASE_POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD-}
      DATABASE_POSTGRES_HOST: ${DATABASE_POSTGRES_HOST-}
      DATABASE_POSTGRES_USER: ${DATABASE_POSTGRES_USER-}
      SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER: ${SERVICES_POSTGRES_ENVIRONMENT_POSTGRES_USER-}
networks:
  document_intelligence-network:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
